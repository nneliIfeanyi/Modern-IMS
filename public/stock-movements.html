<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Movements | ANTOBELL IMS</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700&family=Open+Sans:wght@400;600&display=swap"
        rel="stylesheet">
    <script src="assets/js/theme-init.js"></script>
    <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/app-shell.css" rel="stylesheet">
</head>

<body data-nav="stock-movements">
    <div data-include="partials/topbar.html"></div>
    <div class="app-body">
        <div data-include="partials/sidebar.html"></div>
        <main class="app-main">
            <div class="page-head d-flex justify-content-between align-items-start">
                <div>
                    <h1>Stock Movements</h1>
                    <p>Audit trail of stock in, out, adjustment, and transfer.</p>
                </div>
                <button id="open-movement-form" class="btn btn-primary">+ Record Movement</button>
            </div>

            <div class="shell-card p-3 mb-3">
                <div class="d-flex flex-wrap gap-2 mb-3" id="type-filter-group">
                    <button type="button" class="btn btn-outline-secondary btn-sm active" data-type-filter="all">All
                        types</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" data-type-filter="in">Stock
                        in</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" data-type-filter="out">Stock
                        out</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm"
                        data-type-filter="adjustment">Adjustment</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm"
                        data-type-filter="transfer">Transfer</button>
                </div>

                <div class="row g-2 align-items-end">
                    <div class="col-12 col-md-3">
                        <label for="warehouse-filter" class="form-label mb-1">Warehouse</label>
                        <select id="warehouse-filter" class="form-select">
                            <option value="">All warehouses</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-2">
                        <label for="date-from" class="form-label mb-1">Date from</label>
                        <input id="date-from" type="date" class="form-control">
                    </div>
                    <div class="col-6 col-md-2">
                        <label for="date-to" class="form-label mb-1">Date to</label>
                        <input id="date-to" type="date" class="form-control">
                    </div>
                    <div class="col-12 col-md-5">
                        <label for="movement-search" class="form-label mb-1">Search</label>
                        <input id="movement-search" type="search" class="form-control"
                            placeholder="Search by product, SKU, or reference">
                    </div>
                </div>
            </div>

            <div class="shell-card p-3">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Date / time</th>
                                <th>Product</th>
                                <th>Type</th>
                                <th>Qty</th>
                                <th>Warehouse</th>
                                <th>Reference</th>
                                <th>By</th>
                            </tr>
                        </thead>
                        <tbody id="movements-table-body">
                            <tr>
                                <td colspan="7" class="text-muted">Loading stock movements...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="d-flex flex-wrap justify-content-between align-items-center mt-3 gap-2">
                    <p id="movements-meta" class="mb-0 text-muted small">Showing 0 movements</p>
                    <div class="btn-group">
                        <button id="movements-prev" class="btn btn-outline-secondary btn-sm" type="button">Prev</button>
                        <button id="movements-next" class="btn btn-outline-secondary btn-sm" type="button">Next</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="movementFormCanvas"
        aria-labelledby="movementFormCanvasLabel">
        <div class="offcanvas-header">
            <h5 id="movementFormCanvasLabel" class="offcanvas-title">Record Movement</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <form id="movement-form" novalidate>
                <div class="mb-3">
                    <label class="form-label">Movement type</label>
                    <div class="d-flex flex-wrap gap-2" id="movement-type-group">
                        <button type="button" class="btn btn-outline-primary btn-sm active"
                            data-movement-type="in">Stock in</button>
                        <button type="button" class="btn btn-outline-primary btn-sm" data-movement-type="out">Stock
                            out</button>
                        <button type="button" class="btn btn-outline-primary btn-sm"
                            data-movement-type="adjustment">Adjustment</button>
                        <button type="button" class="btn btn-outline-primary btn-sm"
                            data-movement-type="transfer">Transfer</button>
                    </div>
                </div>

                <div class="mb-3 position-relative">
                    <label for="movement-product-search" class="form-label">Product</label>
                    <input id="movement-product-search" type="text" class="form-control" autocomplete="off"
                        placeholder="Type product name or SKU">
                    <input id="movement-product-id" type="hidden">
                    <div id="movement-product-suggestions" class="list-group position-absolute w-100 shadow-sm d-none"
                        style="z-index: 20;"></div>
                    <div class="invalid-feedback d-block" data-error-for="product_id"></div>
                </div>

                <div class="mb-3">
                    <label for="movement-warehouse" class="form-label">Warehouse</label>
                    <select id="movement-warehouse" class="form-select"></select>
                    <div class="invalid-feedback d-block" data-error-for="warehouse_id"></div>
                </div>

                <div id="destination-wrapper" class="mb-3 d-none">
                    <label for="movement-destination-warehouse" class="form-label">Destination warehouse</label>
                    <select id="movement-destination-warehouse" class="form-select"></select>
                    <div class="invalid-feedback d-block" data-error-for="destination_warehouse_id"></div>
                </div>

                <div class="mb-3">
                    <label for="movement-quantity" class="form-label">Quantity</label>
                    <input id="movement-quantity" type="number" class="form-control" step="1" placeholder="e.g. 10">
                    <div class="form-text">For adjustment, use positive or negative quantity.</div>
                    <div class="invalid-feedback d-block" data-error-for="quantity"></div>
                </div>

                <div class="mb-3">
                    <label for="movement-reference" class="form-label">Reference</label>
                    <input id="movement-reference" type="text" class="form-control" maxlength="100"
                        placeholder="PO-2091, SO-1187, etc.">
                    <div class="invalid-feedback d-block" data-error-for="reference"></div>
                </div>

                <div class="mb-3">
                    <label for="movement-notes" class="form-label">Notes</label>
                    <textarea id="movement-notes" class="form-control" rows="2" maxlength="255"
                        placeholder="Optional internal note"></textarea>
                    <div class="invalid-feedback d-block" data-error-for="notes"></div>
                </div>

                <div class="d-grid">
                    <button id="movement-submit" type="submit" class="btn btn-primary">Save movement</button>
                </div>
            </form>
        </div>
    </div>

    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1090">
        <div id="movement-toast" class="toast align-items-center text-bg-success border-0" role="status"
            aria-live="polite" aria-atomic="true">
            <div class="d-flex">
                <div id="movement-toast-body" class="toast-body">Saved.</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="assets/js/include.js"></script>
    <script type="module" src="assets/js/stock-movements.js"></script>
</body>

</html>
