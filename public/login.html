<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1769d2">
    <link rel="manifest" href="manifest.webmanifest">
    <title>Sign in | CHYPAUL IMS</title>
    <script src="assets/js/theme-init.js"></script>
    <script src="assets/js/pwa.js" defer></script>
    <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/login.css" rel="stylesheet">
</head>

<body class="login-page">
    <main class="login-layout">
        <section class="login-card" aria-labelledby="login-title">
            <a class="login-brand" href="login.html" aria-label="CHYPAUL IMS home">
                <span class="login-brand-mark" aria-hidden="true"><i class="bi bi-box-seam-fill"></i></span>
                <span>CHYPAUL <span class="login-brand-light">IMS</span></span>
            </a>

            <div class="login-heading">
                <span class="login-eyebrow"><i class="bi bi-person-lock" aria-hidden="true"></i> STAFF PORTAL</span>
                <h1 id="login-title">Welcome back</h1>
                <p>Sign in to manage your inventory and operations.</p>
            </div>

            <form id="login-form" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label">Work email</label>
                    <div class="input-group login-input">
                        <span class="input-group-text"><i class="bi bi-envelope" aria-hidden="true"></i></span>
                        <input type="email" id="email" class="form-control" placeholder="you@company.com"
                            autocomplete="username" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group login-input">
                        <span class="input-group-text"><i class="bi bi-lock" aria-hidden="true"></i></span>
                        <input type="password" id="password" class="form-control" placeholder="Enter your password"
                            autocomplete="current-password" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary login-submit">
                    <span>Sign in</span>
                    <i class="bi bi-arrow-right" aria-hidden="true"></i>
                </button>
            </form>

            <div id="feedback" class="alert mt-3 d-none" role="alert"></div>

            <p class="login-security"><i class="bi bi-shield-lock" aria-hidden="true"></i> Secure access for authorized staff</p>
            <button class="btn btn-outline-primary login-install" type="button" data-pwa-install hidden>
                <i class="bi bi-download" aria-hidden="true"></i> Install CHYPAUL IMS
            </button>
        </section>
    </main>

    <script type="module">
        import { login, getCurrentUser } from './assets/js/auth.js';

        const form = document.getElementById('login-form');
        const feedback = document.getElementById('feedback');
        const DASHBOARD_URL = 'dashboard.html';

        const showMessage = (message, type = 'danger') => {
            feedback.textContent = message;
            feedback.className = `alert alert-${type} mt-3`;
        };

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showMessage('Email and password are required.');
                return;
            }

            try {
                const res = await login(email, password);
                showMessage(res.message, 'success');

                const me = await getCurrentUser();
                showMessage(`Logged in as ${me.data.full_name} (${me.data.role}).`, 'success');

                // Give the user a short confirmation moment, then route into the app.
                setTimeout(() => {
                    window.location.href = DASHBOARD_URL;
                }, 350);
            } catch (error) {
                showMessage(error.message || 'Login failed.');
            }
        });

        // If a valid session already exists, skip the login screen entirely.
        (async () => {
            try {
                await getCurrentUser();
                window.location.href = DASHBOARD_URL;
            } catch (error) {
                // Keep user on login when no active session exists.
            }
        })();
    </script>
</body>

</html>
